openapi: 3.0.3
info:
  title: Example Shop API
  version: 2.0.0
  description: |
    ⚠️ **هشدار مهم**
    این API در حال حاضر در محیط تست قرار دارد و داده‌ها ممکن است به‌صورت
    موقت تغییر کنند. لطفاً از استفاده در محیط تولید خودداری کنید.

    Example Shop API (نسخه ۲). این نسخه شامل فیلدهای جدید، صفحه‌بندی مبتنی بر توکن
    و انواع خطاهای بیشتر است.

    > ℹ️ **نکته**
    > این API از صفحه‌بندی مبتنی بر cursor استفاده می‌کند و تمام خطاها از یک شِمای مشترک `Error` پیروی می‌کنند.

    در ادامه یک جدول نمونه برای تست رندر جدول در مستندات آورده شده:

    | شیء            | توضیح                                    |
    |----------------|-------------------------------------------|
    | `User`         | نشان‌دهنده یک کاربر (مشتری) در سیستم است. |
    | `TokenResponse`| خروجی توکن OAuth 2.0                     |

servers:
  - url: http://localhost:5500/v2

tags:
  - name: Users
  - name: Orders
  - name: Auth

paths:
  /users:
    get:
      tags: [Users]
      summary: فهرست کاربران (با صفحه‌بندی مبتنی بر cursor)
      description: |
        ⚠️ **هشدار**
        استفاده از این endpoint ممکن است باعث مصرف زیاد منابع شود. برای تعداد بالا
        درخواست‌ها از `limit` مناسب استفاده کنید.

        یک فهرست صفحه‌بندی‌شده از کاربران را برمی‌گرداند.

        > 💡 **نکته**
        > برای دریافت صفحه بعد می‌توانید از مقدار `next_cursor` در بدنه پاسخ
        > یا هدر `X-Next-Cursor` استفاده کنید.

        جدول زیر نمونه تست رندر جدول برای پارامترهاست:

        | پارامتر   | محل   | نوع     | ضروری؟ | توضیح                             |
        |-----------|--------|---------|---------|-----------------------------------|
        | `cursor`  | query  | string  | خیر     | cursor برای دریافت صفحه بعد.     |
        | `limit`   | query  | integer | خیر     | حداکثر آیتم در هر صفحه (۱–۲۰۰).   |
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
          description: cursor برای صفحه بعد.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
          description: حداکثر تعداد کاربران در هر صفحه.
      responses:
        "200":
          description: موفق
          headers:
            X-Next-Cursor:
              schema: { type: string, example: "eyJvZmZzZXQiOjEwMH0" }
              description: |
                cursor صفحه بعد

                > ℹ️ **نکته**
                > اگر این هدر وجود نداشت یعنی صفحه دیگری باقی نمانده است.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  next_cursor: { type: string, nullable: true, example: "eyJvZmZzZXQiOjEwMH0" }
              examples:
                sample:
                  value:
                    data:
                      - id: "u_123"
                        email: "ada@example.com"
                        name: "Ada Lovelace"
                        phone: "+44 20 7946 0000"
                      - id: "u_456"
                        email: "grace@example.com"
                        name: "Grace Hopper"
                        phone: null
                    next_cursor: null

        "429":
          description: تعداد درخواست بیش از حد مجاز
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                rate_limited:
                  value:
                    type: "https://example.com/errors/rate-limit"
                    title: "محدودیت نرخ"
                    status: 429
                    code: "too_many_requests"
                    detail: "لطفاً تعداد درخواست‌ها را کاهش دهید."
                    traceId: "req_rl429"
          headers:
            Retry-After:
              schema: { type: integer, example: 30 }
              description: |
                تعداد ثانیه‌های لازم برای تلاش مجدد.

                > ⏱️ **نکته**
                > کلاینت باید مقدار این هدر را رعایت کند.

        "500":
          description: خطای داخلی سرور
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                server_error:
                  value:
                    type: "https://example.com/errors/internal"
                    title: "خطای داخلی"
                    status: 500
                    code: "internal_error"
                    detail: "خطای غیرمنتظره رخ داده است."
                    traceId: "req_srv500"

        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{id}:
    patch:
      tags: [Users]
      summary: بروزرسانی بخشی از اطلاعات کاربر
      description: |
        ⚠️ **هشدار**
        فقط فیلدهایی که ارسال می‌کنید بروزرسانی می‌شوند. این عملیات *Partial Update* است نه جایگزینی کامل.

        | فیلد     | نوع    | null؟ | توضیح                        |
        |----------|--------|--------|-------------------------------|
        | `name`   | string | خیر    | نام کامل کاربر.              |
        | `phone`  | string | بله    | شماره تلفن در فرمت E.164.    |
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
          description: شناسه کاربر (مثل `u_123`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                phone: { type: string }
            examples:
              update_name:
                value: { name: "Countess Ada" }
      responses:
        "200":
          description: موفق
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

        "422":
          $ref: "#/components/responses/UnprocessableEntity"

        "404":
          $ref: "#/components/responses/NotFound"

        "401":
          $ref: "#/components/responses/Unauthorized"

  /orders/{id}/refunds:
    post:
      tags: [Orders]
      summary: ایجاد درخواست بازگشت وجه (Refund)
      description: |
        ⚠️ **هشدار**
        تنها سفارش‌هایی که پرداخت شده‌اند می‌توانند Refund شوند. در غیر این صورت یک خطای `403` برمی‌گردد.

        | پارامتر | محل | نوع    | ضروری | توضیح                   |
        |---------|------|--------|--------|--------------------------|
        | `id`    | path | string | بله    | شناسه سفارش.             |

        | فیلد بدنه | نوع   | ضروری | توضیح                      |
        |-----------|--------|--------|----------------------------|
        | `amount`  | number | بله    | مقدار مبلغ قابل برگشت.   |
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number, format: float, minimum: 0.01 }
            examples:
              full_refund: { value: { amount: 129.99 } }
      responses:
        "201":
          description: Refund ایجاد شد
          content:
            application/json:
              schema:
                type: object
                required: [refund_id, order_id, amount]
                properties:
                  refund_id: { type: string, example: "re_123" }
                  order_id: { type: string, example: "ord_1" }
                  amount: { type: number, example: 129.99 }

        "403":
          description: ممنوع
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "409":
          description: تداخل (Refund قبلاً انجام شده است)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/token:
    post:
      tags: [Auth]
      summary: نقطه دریافت توکن OAuth 2.0
      description: |
        > 💡 **نکته**
        > با `grant_type=refresh_token` می‌توانید بدون ورود دوباره کاربر، توکن جدید بگیرید.

        | نوع Grant            | فیلدهای ضروری                                  |
        |-----------------------|------------------------------------------------|
        | `password`            | `username`, `password`, `client_id`, `client_secret` |
        | `refresh_token`       | `refresh_token`, `client_id`, `client_secret` |
        | `client_credentials`  | `client_id`, `client_secret`                  |
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "200":
          description: موفق
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }

        "400":
          $ref: "#/components/responses/BadRequest"

        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  schemas:
    User:
      type: object
      required: [id, email, name]
      properties:
        id: { type: string, example: "u_123" }
        email: { type: string, format: email }
        name: { type: string }
        phone: { type: string, nullable: true }

    TokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: [password, refresh_token, client_credentials]
        username: { type: string, format: email }
        password: { type: string, format: password }
        refresh_token: { type: string }
        client_id: { type: string }
        client_secret: { type: string }

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, example: "Bearer" }
        expires_in: { type: integer, example: 3600 }
        scope: { type: string, example: "read:orders write:refunds" }

    Error:
      type: object
      required: [type, title, status, traceId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

  responses:
    BadRequest:
      description: درخواست نامعتبر
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    Unauthorized:
      description: غیرمجاز
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    NotFound:
      description: پیدا نشد
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    UnprocessableEntity:
      description: خطای اعتبارسنجی
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
